name: Fuzz

on:
  schedule:
    # Weekly fuzz campaign on Sundays at 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      duration:
        description: "Fuzz duration per target (seconds)"
        required: false
        default: "300"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz-smoke:
    name: fuzz smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - validate_url
          - validate_redirect_target
          - validate_content_type
          - extract_content
          - extract_content_bytes
          - strip_control_chars
          - scan_injection_markers
          - build_document_chunks
          - extract_pdf_text
          - canonicalize_url
          - sanitize_pipeline
          - validate_redirect_chain
          - parse_content_length
          - chunk_boundary
          - mixed_utf8_extract
          - bounded_response_reader
          - workflow_kind_parse
          - classify_absence
          - detect_entity_scoped_conflicts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Fuzz smoke test (30s per target)
        run: cargo fuzz run ${{ matrix.target }} -- -max_total_time=30
        working-directory: .

  fuzz-campaign:
    name: fuzz campaign (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: fuzz-smoke
    strategy:
      fail-fast: false
      matrix:
        target:
          - validate_url
          - validate_redirect_target
          - validate_content_type
          - extract_content
          - extract_content_bytes
          - strip_control_chars
          - scan_injection_markers
          - build_document_chunks
          - extract_pdf_text
          - canonicalize_url
          - sanitize_pipeline
          - validate_redirect_chain
          - parse_content_length
          - chunk_boundary
          - mixed_utf8_extract
          - bounded_response_reader
          - workflow_kind_parse
          - classify_absence
          - detect_entity_scoped_conflicts
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz
      - name: Run fuzz campaign
        run: |
          DURATION=${{ github.event.inputs.duration || '300' }}
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=$DURATION
        working-directory: .
      - name: Upload artifacts on crash
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus-${{ matrix.target }}
          path: |
            fuzz/corpus/
            fuzz/artifacts/
          retention-days: 30
