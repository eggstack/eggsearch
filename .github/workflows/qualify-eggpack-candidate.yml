name: Eggpack exact-SHA candidate qualification
'on':
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA to qualify without release writes
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: eggpack-${{ github.workflow }}-${{ inputs.candidate_sha }}
  cancel-in-progress: true
jobs:
  preflight:
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          ref: "${{ inputs.candidate_sha }}"
      - name: Check Cargo availability
        shell: bash
        run: cargo --version
  resolve:
    needs: preflight
    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          ref: "${{ inputs.candidate_sha }}"
      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 20
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev 6656752a141cde155a43f7d416f086431a0e40a4 --locked eggpack-cli
          eggpack --version
      - name: Create runtime identity directory
        shell: bash
        run: "mkdir -p './eggpack-runtime'"
      - name: Resolve runtime release identity
        shell: bash
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          if [[ ! "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then echo 'candidate_sha must be exactly 40 lowercase hexadecimal characters' >&2; exit 1; fi
          head_sha="$(git rev-parse --verify HEAD^{commit})"
          if [[ "$head_sha" != "$CANDIDATE_SHA" ]]; then echo 'checked-out commit does not match candidate_sha' >&2; exit 1; fi
          candidate_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          if [[ ! "$candidate_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo 'Cargo.toml package version must be a three-part numeric version' >&2; exit 1; fi
          candidate_release_id="v${candidate_version}"
          'eggpack' 'ci' '_resolve-release' '--contract' 'release/eggpack/distribution.toml' '--pack-config' 'release/eggpack/pack.toml' '--build-bindings' 'release/eggpack/build-bindings.toml' '--qualification-bindings' 'release/eggpack/qualification-bindings.toml' '--consumer-validators' 'release/eggpack/consumer-validators.json' '--selected' 'linux-x64,linux-arm64,linux-armv7,macos-x64,macos-arm64,windows-x64,windows-arm64' '--tag' "$candidate_release_id" '--source-revision' "$head_sha" '--template' 'release/eggpack/github-template.json' '--source-root' '${{ github.workspace }}' '--output-plan' './eggpack-runtime/release-plan.json' '--output-ci-plan' './eggpack-runtime/release-ci-plan.json' '--output-github-policy' './eggpack-runtime/github-draft.json'
      - name: Upload runtime release identity
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "eggpack-runtime-identity"
          path: "./eggpack-runtime"
          if-no-files-found: error
          retention-days: 7
  build_aarch64_apple_darwin:
    needs: resolve
    runs-on: "macos-15"
    permissions:
      contents: read
    timeout-minutes: 60
    continue-on-error: false
    steps:
      - name: Check out source
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          ref: "${{ inputs.candidate_sha }}"
      - name: Download runtime release identity
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-runtime-identity"
          path: "./eggpack-runtime"
          if-no-files-found: error
      - name: Set up Rust toolchain
        uses: "dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87"
        with:
          toolchain: "stable"
          targets: "aarch64-apple-darwin"
      - name: Verify Rust toolchain
        shell: bash
        run: cargo +'stable' --version
      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 20
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev 6656752a141cde155a43f7d416f086431a0e40a4 --locked eggpack-cli
          eggpack --version
      - name: Verify checked-out release source
        shell: bash
        run: "'eggpack' 'ci' '_verify-source' '--release-plan' 'eggpack-runtime/release-plan.json'"
      - name: Build "aarch64-apple-darwin / eggsearch"
        shell: bash
        env:
          CARGO_TARGET_DIR: "${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}"
        run: "'cargo' '+stable' 'build' '--release' '--locked' '--target' 'aarch64-apple-darwin' '--package' 'eggsearch' '--bin' 'eggsearch'"
      - name: Capture canonical build handoff
        shell: bash
        run: "'eggpack' 'ci' '_capture-build' '--release-plan' 'eggpack-runtime/release-plan.json' '--build-bindings' 'release/eggpack/build-bindings.toml' '--target' 'aarch64-apple-darwin' '--cargo-target-dir' '${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}' '--output-dir' './eggpack-build/build_aarch64_apple_darwin'"
      - name: Upload canonical build handoff
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "eggpack-build-handoff-aarch64-apple-darwin"
          path: "./eggpack-build/build_aarch64_apple_darwin"
          if-no-files-found: error
          retention-days: 7
  build_aarch64_pc_windows_msvc:
    needs: resolve
    runs-on: "windows-11-arm"
    permissions:
      contents: read
    timeout-minutes: 60
    continue-on-error: false
    steps:
      - name: Check out source
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          ref: "${{ inputs.candidate_sha }}"
      - name: Download runtime release identity
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-runtime-identity"
          path: "./eggpack-runtime"
          if-no-files-found: error
      - name: Set up Rust toolchain
        uses: "dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87"
        with:
          toolchain: "stable"
          targets: "aarch64-pc-windows-msvc"
      - name: Verify Rust toolchain
        shell: bash
        run: cargo +'stable' --version
      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 20
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev 6656752a141cde155a43f7d416f086431a0e40a4 --locked eggpack-cli
          eggpack --version
      - name: Verify checked-out release source
        shell: bash
        run: "'eggpack' 'ci' '_verify-source' '--release-plan' 'eggpack-runtime/release-plan.json'"
      - name: Build "aarch64-pc-windows-msvc / eggsearch"
        shell: bash
        env:
          CARGO_TARGET_DIR: "${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}"
        run: "'cargo' '+stable' 'build' '--release' '--locked' '--target' 'aarch64-pc-windows-msvc' '--package' 'eggsearch' '--bin' 'eggsearch'"
      - name: Measure stripped binary size and startup RSS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target = "aarch64-pc-windows-msvc"
          $buildRoot = [System.IO.Path]::Combine($env:RUNNER_TEMP, "eggpack", "$($env:GITHUB_RUN_ID)-$($env:GITHUB_RUN_ATTEMPT)")
          $binary = [System.IO.Path]::Combine($buildRoot, $target, "release", "eggsearch.exe")
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Release binary not found: $binary" }
          $candidateSha = (git rev-parse HEAD).Trim()
          $binaryBytes = [long](Get-Item -LiteralPath $binary).Length
          $rssSamples = @()
          for ($attempt = 0; $attempt -lt 5; $attempt++) {
            $process = [System.Diagnostics.Process]::new()
            $process.StartInfo.FileName = $binary
            $process.StartInfo.Arguments = "--version"
            $process.StartInfo.UseShellExecute = $false
            $process.StartInfo.CreateNoWindow = $true
            $process.StartInfo.RedirectStandardOutput = $true
            $process.StartInfo.RedirectStandardError = $true
            if (-not $process.Start()) { throw "Could not start release binary" }
            $stdout = $process.StandardOutput.ReadToEnd()
            $stderr = $process.StandardError.ReadToEnd()
            $process.WaitForExit()
            if ($process.ExitCode -ne 0) { throw "--version exited with $($process.ExitCode): $stderr" }
            $rssSamples += [long]$process.PeakWorkingSet64
            $process.Dispose()
          }
          $record = [ordered]@{ candidate_sha = $candidateSha; target = $target; binary_bytes = $binaryBytes; probe = "eggsearch --version"; peak_working_set_bytes_samples = $rssSamples; threshold_applied = $false }
          $json = $record | ConvertTo-Json -Compress
          $outputDir = Join-Path $PWD "eggpack-footprint"
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          $outputPath = Join-Path $outputDir "$target.json"
          Set-Content -LiteralPath $outputPath -Value $json -NoNewline -Encoding utf8
          Write-Output $json
      - name: Upload footprint evidence
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "eggsearch-footprint-windows-arm64"
          path: "eggpack-footprint/aarch64-pc-windows-msvc.json"
          if-no-files-found: error
          retention-days: 7
      - name: Capture canonical build handoff
        shell: bash
        run: "'eggpack' 'ci' '_capture-build' '--release-plan' 'eggpack-runtime/release-plan.json' '--build-bindings' 'release/eggpack/build-bindings.toml' '--target' 'aarch64-pc-windows-msvc' '--cargo-target-dir' '${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}' '--output-dir' './eggpack-build/build_aarch64_pc_windows_msvc'"
      - name: Upload canonical build handoff
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "eggpack-build-handoff-aarch64-pc-windows-msvc"
          path: "./eggpack-build/build_aarch64_pc_windows_msvc"
          if-no-files-found: error
          retention-days: 7
  build_aarch64_unknown_linux_gnu:
    needs: resolve
    runs-on: "ubuntu-24.04-arm"
    permissions:
      contents: read
    timeout-minutes: 60
    continue-on-error: false
    steps:
      - name: Check out source
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          ref: "${{ inputs.candidate_sha }}"
      - name: Download runtime release identity
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-runtime-identity"
          path: "./eggpack-runtime"
          if-no-files-found: error
      - name: Set up Rust toolchain
        uses: "dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87"
        with:
          toolchain: "stable"
          targets: "aarch64-unknown-linux-gnu"
      - name: Install exact cargo-zigbuild
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          install_root="${{ runner.temp }}/eggpack/cargo-install/${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$install_root"
          CARGO_INSTALL_ROOT="$install_root" cargo install cargo-zigbuild --version '0.23.3' --locked
          echo "CARGO_INSTALL_ROOT=$install_root" >> "$GITHUB_ENV"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          export PATH="$install_root/bin:$PATH"
          test -x "$install_root/bin/cargo-zigbuild"
      - name: Provision verified Zig 0.14.1
        shell: bash
        run: |
          set -euo pipefail
          zig_version='0.14.1'
          zig_archive='zig-aarch64-linux-0.14.1.tar.xz'
          zig_url='https://ziglang.org/download/0.14.1/zig-aarch64-linux-0.14.1.tar.xz'
          zig_sha='f7a654acc967864f7a050ddacfaa778c7504a0eca8d2b678839c21eea47c992b'
          work="${{ runner.temp }}/eggpack/zig/${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$work"
          archive="$work/$zig_archive"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --proto-redir '=https' --connect-timeout 30 --max-time 600 -o "$archive" "$zig_url"
          printf '%s  %s\n' "$zig_sha" "$archive" | sha256sum --check -
          entries="$(tar -tf "$archive")"
          test -n "$entries"
          if printf '%s\n' "$entries" | grep -Eq '(^/)|(^|/)\.\.(/|$)'; then echo 'rejected Zig archive path' >&2; exit 1; fi
          top="$(printf '%s\n' "$entries" | cut -d/ -f1 | sort -u)"
          test -n "$top"
          test "$(printf '%s\n' "$top" | wc -l)" = "1"
          printf '%s\n' "$entries" | grep -Fxq "$top/zig"
          rm -rf "$work/extract"
          mkdir -p "$work/extract"
          tar -xf "$archive" -C "$work/extract"
          test ! -L "$work/extract/$top/zig"
          test -f "$work/extract/$top/zig"
          test -s "$work/extract/$top/zig"
          test -x "$work/extract/$top/zig"
          zig_bin="$work/extract/$top/zig"
          test "$("$zig_bin" version)" = '0.14.1'
          cache="${{ runner.temp }}/eggpack/zigbuild-cache/${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$cache"
          echo "CARGO_ZIGBUILD_ZIG_PATH=$zig_bin" >> "$GITHUB_ENV"
          echo "CARGO_ZIGBUILD_CACHE_DIR=$cache" >> "$GITHUB_ENV"
          echo "$work/extract/$top" >> "$GITHUB_PATH"
      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 20
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev 6656752a141cde155a43f7d416f086431a0e40a4 --locked eggpack-cli
          eggpack --version
      - name: Verify checked-out release source
        shell: bash
        run: "'eggpack' 'ci' '_verify-source' '--release-plan' 'eggpack-runtime/release-plan.json'"
      - name: Build "aarch64-unknown-linux-gnu / eggsearch"
        shell: bash
        env:
          CARGO_TARGET_DIR: "${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}"
          CARGO_ZIGBUILD_ZIG_PATH: ${{ env.CARGO_ZIGBUILD_ZIG_PATH }}
          CARGO_ZIGBUILD_CACHE_DIR: ${{ env.CARGO_ZIGBUILD_CACHE_DIR }}
        run: "'cargo' '+stable' 'zigbuild' '--release' '--locked' '--target' 'aarch64-unknown-linux-gnu.2.17' '--package' 'eggsearch' '--bin' 'eggsearch'"
      - name: Measure stripped binary size and startup RSS
        shell: bash
        run: |
          set -euo pipefail
          target="aarch64-unknown-linux-gnu"
          build_root="$RUNNER_TEMP/eggpack/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          binary="$build_root/$target/release/eggsearch"
          test -x "$binary"
          candidate_sha="$(git rev-parse HEAD)"
          binary_bytes="$(wc -c < "$binary" | tr -d '[:space:]')"
          rss_samples=""
          for _ in 1 2 3 4 5; do
            sample="$(/usr/bin/time -f '%M' "$binary" --version 2>&1 >/dev/null)"
            [[ "$sample" =~ ^[0-9]+$ ]]
            if [[ -n "$rss_samples" ]]; then rss_samples="$rss_samples,"; fi
            rss_samples="$rss_samples$sample"
          done
          mkdir -p eggpack-footprint
          printf '{"candidate_sha":"%s","target":"%s","binary_bytes":%s,"probe":"eggsearch --version","peak_rss_kib_samples":[%s],"threshold_applied":false}\n' "$candidate_sha" "$target" "$binary_bytes" "$rss_samples" | tee "eggpack-footprint/$target.json"
      - name: Upload footprint evidence
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "eggsearch-footprint-linux-arm64"
          path: "eggpack-footprint/aarch64-unknown-linux-gnu.json"
          if-no-files-found: error
          retention-days: 7
      - name: Capture canonical build handoff
        shell: bash
        run: "'eggpack' 'ci' '_capture-build' '--release-plan' 'eggpack-runtime/release-plan.json' '--build-bindings' 'release/eggpack/build-bindings.toml' '--target' 'aarch64-unknown-linux-gnu' '--cargo-target-dir' '${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}' '--output-dir' './eggpack-build/build_aarch64_unknown_linux_gnu'"
      - name: Upload canonical build handoff
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "eggpack-build-handoff-aarch64-unknown-linux-gnu"
          path: "./eggpack-build/build_aarch64_unknown_linux_gnu"
          if-no-files-found: error
          retention-days: 7
