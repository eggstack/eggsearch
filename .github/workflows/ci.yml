name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: rustfmt, clippy
      - name: Run routine verification
        run: make ci
        env:
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          GITLAB_TOKEN: ""
          CODEBERG_TOKEN: ""
          GITEA_TOKEN: ""
          FORGEJO_TOKEN: ""
          SOURCEGRAPH_API_KEY: ""
          BRAVE_API_KEY: ""
          SEMANTIC_SCHOLAR_API_KEY: ""
          NVD_API_KEY: ""
