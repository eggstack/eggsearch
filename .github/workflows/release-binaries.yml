name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      mode:
        description: Qualification is non-publishing; release requires a published crate and vX.Y.Z tag
        required: true
        default: qualify
        type: choice
        options:
          - qualify
          - release
      ref:
        description: Branch or commit SHA to qualify; ignored for tag pushes
        required: false
        type: string
      tag:
        description: Existing vX.Y.Z tag for release mode; not used by qualification
        required: false
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  ZIG_VERSION: 0.13.0
  CARGO_ZIGBUILD_VERSION: 0.20.1

jobs:
  preflight:
    name: Preflight (${{ inputs.mode || 'release' }})
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.release.outputs.mode }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      artifact_prefix: ${{ steps.release.outputs.artifact_prefix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Resolve exact candidate and validate tree
        id: release
        env:
          MODE: ${{ inputs.mode || 'release' }}
          REQUESTED_REF: ${{ inputs.ref || inputs.tag || github.ref }}
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mode="$MODE"
          if [[ "$mode" != qualify && "$mode" != release ]]; then
            echo "mode must be qualify or release, got '$mode'" >&2
            exit 1
          fi
          missing=0
          required=(Cargo.toml Cargo.lock packaging/release-targets.txt packaging/release-smoke.sh packaging/release-smoke.ps1 packaging/install.sh packaging/install.ps1 packaging/release-inputs.txt packaging/release-validate.sh packaging/check-contract.sh packaging/test-install.sh packaging/test-install.ps1)
          for path in "${required[@]}"; do
            if [[ ! -e "$path" ]]; then
              echo "release input missing from candidate checkout: $path" >&2
              missing=1
            fi
          done
          if ((missing)); then
            echo "candidate ref $REQUESTED_REF is missing required release inputs at $(git rev-parse HEAD)" >&2
            exit 1
          fi
          commit="$(git rev-parse HEAD)"
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "candidate checkout is dirty at $commit" >&2
            exit 1
          fi
          version="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "eggsearch") | .version')"
          tag="-"
          if [[ "$mode" == release ]]; then
            tag="$REQUESTED_TAG"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
              echo "release tag '$tag' is not a v<semver> tag" >&2
              exit 1
            fi
            tag_commit="$(git rev-list -n 1 "$tag")"
            if [[ "$tag_commit" != "$commit" ]]; then
              echo "checked out commit $commit is not the commit tagged by $tag ($tag_commit)" >&2
              exit 1
            fi
            if [[ "${version}" != "${tag#v}" ]]; then
              echo "Cargo.toml version $version does not match tag $tag" >&2
              exit 1
            fi
            registry_status="$(curl --silent --show-error --location --output /tmp/eggsearch-crate.json --write-out '%{http_code}' --header 'User-Agent: eggsearch-release-preflight' "https://crates.io/api/v1/crates/eggsearch/${version}")"
            if [[ "$registry_status" != 200 ]]; then
              echo "crates.io does not expose eggsearch $version yet (HTTP $registry_status)" >&2
              exit 1
            fi
            registry_version="$(jq -r '.version.num' /tmp/eggsearch-crate.json)"
            if [[ "$registry_version" != "$version" ]]; then
              echo "crates.io returned version $registry_version for requested $version" >&2
              exit 1
            fi
          fi
          ./packaging/release-validate.sh tree "$commit"
          artifact_prefix="${mode}-${version}-${commit:0:12}"
          {
            echo "mode=$mode"
            echo "tag=$tag"
            echo "version=$version"
            echo "commit=$commit"
            echo "artifact_prefix=$artifact_prefix"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release binaries preflight"
            echo "- mode: `$mode`"
            echo "- commit: `$commit`"
            echo "- package version: `$version`"
            echo "- tag: `$tag`"
            echo "- `QUALIFIED_SHA=$commit`"
            echo "- release tree: complete"
            if [[ "$mode" == qualify ]]; then
              echo "- next action: inspect the qualification artifact; no GitHub Release will be changed"
            else
              echo "- next action: review the draft GitHub Release after all seven targets pass"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: eggsearch-x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: eggsearch-aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          targets: ${{ matrix.target }}
      - name: Install pinned cargo-zigbuild
        run: cargo install cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION" --locked
      - name: Build, smoke, and checksum
        shell: bash
        run: |
          set -euo pipefail
          cargo zigbuild --locked --release --target "${{ matrix.target }}.2.17"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/eggsearch" "dist/${{ matrix.asset }}"
          chmod 0755 "dist/${{ matrix.asset }}"
          file "dist/${{ matrix.asset }}" | grep -E 'ELF 64-bit.*(x86-64|ARM aarch64)' >/dev/null
          versions="$(readelf --version-info "dist/${{ matrix.asset }}" | grep -oE 'GLIBC_[0-9.]+' | sort -Vu || true)"
          if printf '%s\n' "$versions" | grep -Eq 'GLIBC_([3-9]|2\.(1[8-9]|[2-9][0-9]))'; then
            echo "binary requires a glibc newer than documented 2.17 floor" >&2
            exit 1
          fi
          ./packaging/release-smoke.sh "dist/${{ matrix.asset }}" "${{ needs.preflight.outputs.version }}"
          sha256sum "dist/${{ matrix.asset }}" | sed "s#  .*#  ${{ matrix.asset }}#" > "dist/${{ matrix.asset }}.sha256"
          (cd dist && sha256sum -c "${{ matrix.asset }}.sha256")
      - name: Record target result
        if: always()
        shell: bash
        run: echo "| ${{ matrix.target }} | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.preflight.outputs.artifact_prefix }}-${{ matrix.target }}
          path: dist

  linux-armv7:
    name: Linux armv7 qualification
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          targets: armv7-unknown-linux-gnueabihf
      - name: Install pinned cargo-zigbuild
        run: cargo install cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION" --locked
      - name: Build, smoke, and checksum
        shell: bash
        run: |
          set -euo pipefail
          asset="eggsearch-armv7-unknown-linux-gnueabihf"
          cargo zigbuild --locked --release --target armv7-unknown-linux-gnueabihf.2.17
          mkdir -p dist
          cp target/armv7-unknown-linux-gnueabihf/release/eggsearch "dist/$asset"
          chmod 0755 "dist/$asset"
          file "dist/$asset" | grep -E 'ELF 32-bit.*ARM' >/dev/null
          armv7_run() {
            docker run --rm --platform linux/arm/v7 -v "$PWD/dist:/dist:ro" arm32v7/ubuntu:20.04 /lib/ld-linux-armhf.so.3 --library-path /lib/arm-linux-gnueabihf:/lib:/usr/lib "/dist/$asset" "$@"
          }
          armv7_run --version | grep -F "${{ needs.preflight.outputs.version }}"
          armv7_run --help >/dev/null
          sha256sum "dist/$asset" | sed "s#  .*#  $asset#" > "dist/$asset.sha256"
          (cd dist && sha256sum -c "$asset.sha256")
      - name: Record target result
        if: always()
        shell: bash
        run: echo "| armv7-unknown-linux-gnueabihf | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.preflight.outputs.artifact_prefix }}-armv7-unknown-linux-gnueabihf
          path: dist

  macos:
    name: macOS ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: eggsearch-x86_64-apple-darwin
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: eggsearch-aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          targets: ${{ matrix.target }}
      - name: Build, smoke, and checksum
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --release --target "${{ matrix.target }}"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/eggsearch" "dist/${{ matrix.asset }}"
          chmod 0755 "dist/${{ matrix.asset }}"
          ./packaging/release-smoke.sh "dist/${{ matrix.asset }}" "${{ needs.preflight.outputs.version }}"
          shasum -a 256 "dist/${{ matrix.asset }}" | sed "s#  .*#  ${{ matrix.asset }}#" > "dist/${{ matrix.asset }}.sha256"
          (cd dist && shasum -a 256 -c "${{ matrix.asset }}.sha256")
      - name: Record target result
        if: always()
        shell: bash
        run: echo "| ${{ matrix.target }} | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.preflight.outputs.artifact_prefix }}-${{ matrix.target }}
          path: dist

  windows:
    name: Windows ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset: eggsearch-x86_64-pc-windows-msvc.exe
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset: eggsearch-aarch64-pc-windows-msvc.exe
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          targets: ${{ matrix.target }}
      - name: Build, smoke, and checksum
        run: |
          cargo build --locked --release --target ${{ matrix.target }}
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "target\${{ matrix.target }}\release\eggsearch.exe" "dist\${{ matrix.asset }}"
          & .\packaging\release-smoke.ps1 "dist\${{ matrix.asset }}" "${{ needs.preflight.outputs.version }}"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist\${{ matrix.asset }}").Hash.ToLowerInvariant()
          "$hash  ${{ matrix.asset }}" | Set-Content -NoNewline "dist\${{ matrix.asset }}.sha256"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath "dist\${{ matrix.asset }}").Hash.ToLowerInvariant()
          if ($actual -ne $hash) { throw 'checksum verification failed' }
      - name: Record target result
        if: always()
        run: Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "| ${{ matrix.target }} | ${{ job.status }} |"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.preflight.outputs.artifact_prefix }}-${{ matrix.target }}
          path: dist

  assemble:
    name: Assemble ${{ needs.preflight.outputs.mode }} release output
    needs: [preflight, linux, linux-armv7, macos, windows]
    if: ${{ needs.preflight.result == 'success' && needs.linux.result == 'success' && needs['linux-armv7'].result == 'success' && needs.macos.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ needs.preflight.outputs.artifact_prefix }}-*
          merge-multiple: true
          path: dist
      - name: Verify complete asset set
        shell: bash
        run: |
          set -euo pipefail
          cp packaging/install.sh packaging/install.ps1 dist/
          ./packaging/release-validate.sh assets dist "${{ needs.preflight.outputs.mode }}" "${{ needs.preflight.outputs.commit }}" "${{ needs.preflight.outputs.tag }}" "${{ needs.preflight.outputs.version }}"
      - name: Upload qualification-only artifact
        if: ${{ needs.preflight.outputs.mode == 'qualify' }}
        uses: actions/upload-artifact@v4
        with:
          name: qualification-${{ needs.preflight.outputs.version }}-${{ needs.preflight.outputs.commit }}-complete
          path: dist
      - name: Create or update draft release
        if: ${{ needs.preflight.outputs.mode == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.preflight.outputs.tag }}"
          version="${{ needs.preflight.outputs.version }}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --title "eggsearch $version" --notes "Default-feature release binaries for eggsearch $version."
          else
            draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
            if [[ "$draft" != true ]]; then
              echo "release $tag already exists and is published; refusing to overwrite it" >&2
              exit 1
            fi
          fi
          gh release upload "$tag" dist/* --clobber
      - name: Write release summary
        shell: bash
        run: |
          {
            echo "## Release binaries assembly"
            echo "| Target | Result |"
            echo "|---|---|"
            echo "| x86_64-unknown-linux-gnu | passed |"
            echo "| aarch64-unknown-linux-gnu | passed |"
            echo "| armv7-unknown-linux-gnueabihf | passed |"
            echo "| x86_64-apple-darwin | passed |"
            echo "| aarch64-apple-darwin | passed |"
            echo "| x86_64-pc-windows-msvc | passed |"
            echo "| aarch64-pc-windows-msvc | passed |"
            echo "- asset-set completeness: passed (16 files)"
            echo "- commit: `${{ needs.preflight.outputs.commit }}`"
            echo "- package version: `${{ needs.preflight.outputs.version }}`"
            echo "- mode: `${{ needs.preflight.outputs.mode }}`"
            if [[ "${{ needs.preflight.outputs.mode }}" == qualify ]]; then
              echo "- draft release created/updated: no"
              echo "- next action: inspect the qualification-only artifact; publish the crate only after review"
            else
              echo "- draft release created/updated: yes"
              echo "- next action: independently verify assets, then publish the draft release manually"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
