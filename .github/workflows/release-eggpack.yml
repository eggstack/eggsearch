          path: "./eggpack-inputs/x86_64-apple-darwin"
      - name: Download qualification "x86_64-pc-windows-msvc"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-evidence-x86_64-pc-windows-msvc"
          path: "./eggpack-inputs/x86_64-pc-windows-msvc"
      - name: Download qualification "x86_64-unknown-linux-gnu"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-evidence-x86_64-unknown-linux-gnu"
          path: "./eggpack-inputs/x86_64-unknown-linux-gnu"
      - name: Download consumer evidence "aarch64-apple-darwin"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-consumer-evidence-aarch64-apple-darwin"
