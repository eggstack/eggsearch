          path: "./eggpack-inputs/aarch64-unknown-linux-gnu"
      - name: Download consumer evidence "armv7-unknown-linux-gnueabihf"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-consumer-evidence-armv7-unknown-linux-gnueabihf"
          path: "./eggpack-inputs/armv7-unknown-linux-gnueabihf"
      - name: Download consumer evidence "x86_64-apple-darwin"
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-consumer-evidence-x86_64-apple-darwin"
