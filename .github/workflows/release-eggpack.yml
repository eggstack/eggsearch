  stage:
    needs: aggregate
    if: github.event_name == 'workflow_dispatch'
    runs-on: "ubuntu-24.04"
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          ref: "${{ inputs.release_tag }}"
      - name: Download runtime release identity
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-runtime-identity"
          path: "./eggpack-runtime"
          if-no-files-found: error
      - name: Validate exact-tag source
        shell: bash
        run: "test -n \"${{ inputs.release_tag }}\""
      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 20
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev 6656752a141cde155a43f7d416f086431a0e40a4 --locked eggpack-cli
          eggpack --version
      - name: Verify checked-out release source
        shell: bash
        run: "'eggpack' 'ci' '_verify-source' '--release-plan' 'eggpack-runtime/release-plan.json'"
      - name: Download finalized release
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-finalized-release"
          path: ./eggpack-finalized
          if-no-files-found: error
      - name: Prepare staging payload
        shell: bash
        run: "'eggpack' 'ci' '_prepare-stage' '--contract' 'release/eggpack/distribution.toml' '--release-manifest' './eggpack-finalized/release-manifest.json' '--finalized-root' './eggpack-finalized/root' '--github-policy' 'eggpack-runtime/github-draft.json' '--install-policy' 'release/eggpack/install-policy.toml' '--output-dir' './eggpack-staging' '--output-payload' './eggpack-staging-payload.json' '--installer-presentation' 'release/eggpack/installer-presentation.json' '--source-root' '${{ github.workspace }}'"
      - name: Stage GitHub draft release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: "'eggpack' 'ci' '_stage-github-draft' '--payload' './eggpack-staging-payload.json' '--github-policy' 'eggpack-runtime/github-draft.json' '--staging-dir' './eggpack-staging' '--output-receipt' './eggpack-staging-receipt.json'"
      - name: Upload staging receipt
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "eggpack-staging-receipt"
          path: ./eggpack-staging-receipt.json
          if-no-files-found: error
          retention-days: 7
