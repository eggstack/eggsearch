    runs-on: "ubuntu-24.04"
    permissions:
      contents: read
    timeout-minutes: 60
    continue-on-error: false
    steps:
      - name: Check out source
        uses: "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683"
        with:
          ref: "${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}"
      - name: Download runtime release identity
        uses: "actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093"
        with:
          name: "eggpack-runtime-identity"
          path: "./eggpack-runtime"
          if-no-files-found: error
      - name: Set up Rust toolchain
        uses: "dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87"
        with:
          toolchain: "stable"
          targets: "x86_64-unknown-linux-gnu"
      - name: Install exact cargo-zigbuild
        shell: bash
        timeout-minutes: 20
        run: |
          set -euo pipefail
          install_root="${{ runner.temp }}/eggpack/cargo-install/${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$install_root"
          CARGO_INSTALL_ROOT="$install_root" cargo install cargo-zigbuild --version '0.23.3' --locked
          echo "CARGO_INSTALL_ROOT=$install_root" >> "$GITHUB_ENV"
          echo "$install_root/bin" >> "$GITHUB_PATH"
          export PATH="$install_root/bin:$PATH"
          test -x "$install_root/bin/cargo-zigbuild"
      - name: Provision verified Zig 0.14.1
        shell: bash
        run: |
          set -euo pipefail
          zig_version='0.14.1'
          zig_archive='zig-x86_64-linux-0.14.1.tar.xz'
          zig_url='https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz'
          zig_sha='24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c'
          work="${{ runner.temp }}/eggpack/zig/${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$work"
          archive="$work/$zig_archive"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --proto-redir '=https' --connect-timeout 30 --max-time 600 -o "$archive" "$zig_url"
          printf '%s  %s\n' "$zig_sha" "$archive" | sha256sum --check -
          entries="$(tar -tf "$archive")"
          test -n "$entries"
          if printf '%s\n' "$entries" | grep -Eq '(^/)|(^|/)\.\.(/|$)'; then echo 'rejected Zig archive path' >&2; exit 1; fi
          top="$(printf '%s\n' "$entries" | cut -d/ -f1 | sort -u)"
          test -n "$top"
          test "$(printf '%s\n' "$top" | wc -l)" = "1"
          printf '%s\n' "$entries" | grep -Fxq "$top/zig"
          rm -rf "$work/extract"
          mkdir -p "$work/extract"
          tar -xf "$archive" -C "$work/extract"
          test ! -L "$work/extract/$top/zig"
          test -f "$work/extract/$top/zig"
          test -s "$work/extract/$top/zig"
          test -x "$work/extract/$top/zig"
          zig_bin="$work/extract/$top/zig"
          test "$("$zig_bin" version)" = '0.14.1'
          cache="${{ runner.temp }}/eggpack/zigbuild-cache/${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$cache"
          echo "CARGO_ZIGBUILD_ZIG_PATH=$zig_bin" >> "$GITHUB_ENV"
          echo "CARGO_ZIGBUILD_CACHE_DIR=$cache" >> "$GITHUB_ENV"
          echo "$work/extract/$top" >> "$GITHUB_PATH"
      - name: Install pinned Eggpack tool
        shell: bash
        timeout-minutes: 20
        run: |
          cargo install --git https://github.com/eggstack/eggpack --rev 6656752a141cde155a43f7d416f086431a0e40a4 --locked eggpack-cli
          eggpack --version
      - name: Verify checked-out release source
        shell: bash
        run: "'eggpack' 'ci' '_verify-source' '--release-plan' 'eggpack-runtime/release-plan.json'"
      - name: Build "x86_64-unknown-linux-gnu / eggsearch"
        shell: bash
        env:
          CARGO_TARGET_DIR: "${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}"
          CARGO_ZIGBUILD_ZIG_PATH: ${{ env.CARGO_ZIGBUILD_ZIG_PATH }}
          CARGO_ZIGBUILD_CACHE_DIR: ${{ env.CARGO_ZIGBUILD_CACHE_DIR }}
        run: "'cargo' '+stable' 'zigbuild' '--release' '--locked' '--target' 'x86_64-unknown-linux-gnu.2.17' '--package' 'eggsearch' '--bin' 'eggsearch'"
      - name: Capture canonical build handoff
        shell: bash
        run: "'eggpack' 'ci' '_capture-build' '--release-plan' 'eggpack-runtime/release-plan.json' '--build-bindings' 'release/eggpack/build-bindings.toml' '--target' 'x86_64-unknown-linux-gnu' '--cargo-target-dir' '${{ runner.temp }}/eggpack/${{ github.run_id }}-${{ github.run_attempt }}' '--output-dir' './eggpack-build/build_x86_64_unknown_linux_gnu'"
      - name: Upload canonical build handoff
        uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02"
        with:
          name: "eggpack-build-handoff-x86_64-unknown-linux-gnu"
          path: "./eggpack-build/build_x86_64_unknown_linux_gnu"
          if-no-files-found: error
          retention-days: 7
