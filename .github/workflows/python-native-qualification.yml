name: Python native qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "bindings/python/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/python-native-qualification.yml"
  push:
    branches:
      - main
      - plan/python-native-library
    paths:
      - "bindings/python/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/python-native-qualification.yml"

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build ${{ matrix.target }} CPython ${{ matrix.python }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: linux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, python: "3.11", linux: true }
          - { id: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, python: "3.11", linux: true }
          - { id: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, python: "3.11", linux: false }
          - { id: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, python: "3.11", linux: false }
          - { id: windows-x86_64, runner: windows-2022, target: x86_64-pc-windows-msvc, python: "3.11", linux: false }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Check candidate package metadata
        run: |
          python -c "import tomllib; from pathlib import Path; project=tomllib.loads(Path('bindings/python/pyproject.toml').read_text())['project']; binding=tomllib.loads(Path('bindings/python/Cargo.toml').read_text())['package']; root=tomllib.loads(Path('Cargo.toml').read_text())['package']; assert project['name'] == 'eggsearch'; assert project['license'] == 'MIT'; assert project['version'] == binding['version'] == root['version']; print(project['name'], project['version'], project['license'])"
      - if: matrix.linux
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          maturin-version: v1.9.5
          rust-toolchain: 1.89.0
          manylinux: "2014"
          args: --manifest-path bindings/python/Cargo.toml --release --locked --out dist -i python${{ matrix.python }}
      - if: ${{ !matrix.linux }}
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.89.0
          targets: ${{ matrix.target }}
      - if: ${{ !matrix.linux }}
        run: python -m pip install maturin==1.9.5
      - if: ${{ !matrix.linux }}
        run: maturin build --manifest-path bindings/python/Cargo.toml --release --locked --out dist --interpreter python
      - name: Record wheel metadata and digest
        shell: bash
        run: |
          python -m pip install --no-index --no-deps --only-binary=:all: dist/*.whl
          python -c "from importlib.metadata import distribution; d=distribution('eggsearch'); print(d.metadata['Name'], d.version); print(*d.files, sep='\\n')" > dist/metadata.txt
          sha256sum dist/*.whl | tee dist/SHA256SUMS
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wheel-${{ matrix.id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - env:
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          python -c "import os; open(os.environ['GITHUB_STEP_SUMMARY'], 'a').write('GitHub artifact digest: ' + os.environ['ARTIFACT_DIGEST'] + '\\n')"

  wheel-smoke:
    name: Smoke ${{ matrix.target }} CPython ${{ matrix.python }}
    needs: build-wheel
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: linux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, python: "3.11" }
          - { id: linux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, python: "3.12" }
          - { id: linux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, python: "3.13" }
          - { id: linux-x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, python: "3.14" }
          - { id: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, python: "3.11" }
          - { id: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, python: "3.12" }
          - { id: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, python: "3.13" }
          - { id: linux-aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, python: "3.14" }
          - { id: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, python: "3.11" }
          - { id: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, python: "3.12" }
          - { id: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, python: "3.13" }
          - { id: macos-x86_64, runner: macos-15-intel, target: x86_64-apple-darwin, python: "3.14" }
          - { id: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, python: "3.11" }
          - { id: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, python: "3.12" }
          - { id: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, python: "3.13" }
          - { id: macos-arm64, runner: macos-15, target: aarch64-apple-darwin, python: "3.14" }
          - { id: windows-x86_64, runner: windows-2022, target: x86_64-pc-windows-msvc, python: "3.11" }
          - { id: windows-x86_64, runner: windows-2022, target: x86_64-pc-windows-msvc, python: "3.12" }
          - { id: windows-x86_64, runner: windows-2022, target: x86_64-pc-windows-msvc, python: "3.13" }
          - { id: windows-x86_64, runner: windows-2022, target: x86_64-pc-windows-msvc, python: "3.14" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: wheel-${{ matrix.id }}
          path: ${{ runner.temp }}/wheelhouse
      - name: Create a clean consumer environment
        run: python -m venv "$RUNNER_TEMP/.venv"
        shell: bash
      - name: Test installed wheel outside checkout
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            python_bin="$(cygpath -u "$RUNNER_TEMP")/.venv/Scripts/python.exe"
          else
            python_bin="$RUNNER_TEMP/.venv/bin/python"
          fi
          "$python_bin" -m pip install --no-index --no-deps --only-binary=:all: wheelhouse/*.whl
          "$python_bin" -m pip install pytest==8.4.2
          "$python_bin" -m pytest -q "$GITHUB_WORKSPACE/bindings/python/tests"
        shell: bash
        working-directory: ${{ runner.temp }}

  source-distribution:
    name: Rebuild and smoke extracted sdist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.89.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - run: python -m pip install maturin==1.9.5
      - name: Build sdist, prefetch locked crates, and rebuild offline
        shell: bash
        run: |
          maturin build --manifest-path bindings/python/Cargo.toml --release --sdist --locked --out dist
          cargo fetch --locked --manifest-path bindings/python/Cargo.toml
          mkdir extracted
          tar -xzf dist/*.tar.gz -C extracted
          source_dir="$(find extracted -mindepth 1 -maxdepth 1 -type d)"
          source_dir="$(cd "$source_dir" && pwd)"
          (cd "$source_dir" && CARGO_NET_OFFLINE=true maturin build --release --locked --out "$GITHUB_WORKSPACE/extracted-wheel")
          python -m venv "$RUNNER_TEMP/runtime-venv"
          "$RUNNER_TEMP/runtime-venv/bin/python" -m pip install --no-index --no-deps extracted-wheel/*.whl
          "$RUNNER_TEMP/runtime-venv/bin/python" -m pip install pytest==8.4.2
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/runtime-venv/bin/python" -m pytest -q "$source_dir/bindings/python/tests"
          "$RUNNER_TEMP/runtime-venv/bin/python" -c "import eggsearch; from importlib.metadata import distribution; assert len(eggsearch.tool_names()) == 10; assert distribution('eggsearch').version == '0.4.3'"
          sha256sum "$GITHUB_WORKSPACE"/dist/* "$GITHUB_WORKSPACE"/extracted-wheel/* | tee "$GITHUB_WORKSPACE/dist/SHA256SUMS"
          cat "$GITHUB_WORKSPACE/dist/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-sdist-and-extracted-wheel
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            extracted-wheel/*.whl
          if-no-files-found: error
          retention-days: 14

  dependency-audit:
    name: Audit binding dependency graph
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.89.0
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
        working-directory: bindings/python
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip==26.2.1
      - run: python -m pip install pip-audit==2.10.1 maturin==1.9.5
      - run: pip-audit --local --progress-spinner off
