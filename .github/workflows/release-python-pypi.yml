name: Python PyPI release

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character commit SHA that passed qualification
        required: true
        type: string
      qualification_run_id:
        description: Successful Python native qualification workflow run ID
        required: true
        type: string
      version:
        description: Exact synchronized package version
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-candidate:
    name: Verify qualified source and artifact inventory
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.89.0
      - name: Verify exact candidate and successful qualification runs
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "${#CANDIDATE_SHA}" -eq 40
          case "$CANDIDATE_SHA" in *[!0-9a-f]*) exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python -c "import os,tomllib; from pathlib import Path; expected=os.environ['RELEASE_VERSION']; root=tomllib.loads(Path('Cargo.toml').read_text())['package']['version']; binding=tomllib.loads(Path('bindings/python/Cargo.toml').read_text())['package']['version']; project=tomllib.loads(Path('bindings/python/pyproject.toml').read_text())['project']['version']; assert root == binding == project == expected"
          qualification_sha="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFICATION_RUN_ID" --jq 'select(.name == "Python native qualification" and .status == "completed" and .conclusion == "success") | .head_sha')"
          test "$qualification_sha" = "$CANDIDATE_SHA"
          ci_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$CANDIDATE_SHA&per_page=100" --jq "[.workflow_runs[] | select(.name == \"CI\" and .status == \"completed\" and .conclusion == \"success\" and .head_sha == \"$CANDIDATE_SHA\")] | length")"
          test "$ci_runs" -ge 1
          test "$(gh api "repos/$GITHUB_REPOSITORY/environments/pypi" --jq '.name')" = "pypi"
          cargo publish --dry-run --locked
          pypi_status="$(curl --silent --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/eggsearch/$RELEASE_VERSION/json")"
          test "$pypi_status" = 404
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.15"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          run-id: ${{ inputs.qualification_run_id }}
          github-token: ${{ github.token }}
          path: artifacts
      - name: Verify immutable release inventory
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
        run: |
          python -m pip install packaging==26.0
          python bindings/python/scripts/verify_release_artifacts.py artifacts "$RELEASE_VERSION" release-manifest.json --source-sha "$CANDIDATE_SHA" --qualification-run-id "$QUALIFICATION_RUN_ID"
          mkdir -p release/packages
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp '{}' release/packages/ \;
          cp release-manifest.json release/MANIFEST.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-python-release-inventory
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Human-approved PyPI publication
    needs: verify-candidate
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/eggsearch/
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-python-release-inventory
          path: release
      - name: Publish verified inventory with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: release/packages/

  post-publication-consumer:
    name: Public PyPI install on ${{ matrix.platform }} CPython 3.15
    needs: publish
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: macos-x86_64, runner: macos-15-intel }
          - { platform: macos-arm64, runner: macos-15 }
          - { platform: windows-x86_64, runner: windows-2022 }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.15"
      - name: Install only the published binary wheel
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/consumer-venv"
          if [ "$RUNNER_OS" = "Windows" ]; then
            python_bin="$(cygpath -u "$RUNNER_TEMP")/consumer-venv/Scripts/python.exe"
          else
            python_bin="$RUNNER_TEMP/consumer-venv/bin/python"
          fi
          "$python_bin" -m pip install --report "$RUNNER_TEMP/pip-report.json" --only-binary=:all: --no-deps "eggsearch==$RELEASE_VERSION"
          "$python_bin" -m pip debug --verbose > "$RUNNER_TEMP/pip-debug.txt"
          "$python_bin" -c "import json,os; report=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'pip-report.json'))); item=next(x for x in report['install'] if x['metadata']['name'].lower() == 'eggsearch'); print(item['download_info']['url'], item['download_info']['archive_info'].get('hashes',{}))"
          cat "$RUNNER_TEMP/pip-debug.txt" >> "$GITHUB_STEP_SUMMARY"
          echo "PYTHON_BIN=$python_bin" >> "$GITHUB_ENV"
        shell: bash
      - name: Smoke the installed public package outside the checkout
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            workspace_path="$(cygpath -u "$GITHUB_WORKSPACE")"
          else
            workspace_path="$GITHUB_WORKSPACE"
          fi
          "$PYTHON_BIN" "$workspace_path/bindings/python/scripts/smoke_installed_wheel.py"
        working-directory: ${{ runner.temp }}
        shell: bash

  post-publication-armv7-consumer:
    name: Public PyPI install in emulated ARMv7 manylinux 2.31
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a
        with:
          platforms: arm
      - name: Install only the published ARMv7 wheel and smoke it
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          docker run --rm --platform linux/arm/v7 \
            -e RELEASE_VERSION \
            -v "$GITHUB_WORKSPACE:/source:ro" \
            quay.io/pypa/manylinux_2_31_armv7l@sha256:ff4a72812594311c071eebce43efcaa9061bd1205649d864c1054d4e56e6bdae \
            /bin/bash -euxo pipefail -c '
              python_bin=/opt/python/cp311-cp311/bin/python
              "$python_bin" -m venv /tmp/eggsearch-venv
              /tmp/eggsearch-venv/bin/python -m pip install --report /tmp/pip-report.json --only-binary=:all: --no-deps "eggsearch==${RELEASE_VERSION}"
              cd /tmp
              /tmp/eggsearch-venv/bin/python -c "import json; report=json.load(open(\"/tmp/pip-report.json\")); item=next(x for x in report[\"install\"] if x[\"metadata\"][\"name\"].lower() == \"eggsearch\"); print(item[\"download_info\"][\"url\"], item[\"download_info\"][\"archive_info\"].get(\"hashes\", {}))"
              /tmp/eggsearch-venv/bin/python -m pip debug --verbose
              /tmp/eggsearch-venv/bin/python /source/bindings/python/scripts/smoke_installed_wheel.py
            '
