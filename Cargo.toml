[package]
name = "eggsearch"
version = "0.3.9"
edition = "2021"
rust-version = "1.89"
authors = ["eggstack"]
license = "MIT"
description = "Lightweight MCP metasearch server for AI agents"
repository = "https://github.com/eggstack/eggsearch"
homepage = "https://docs.rs/eggsearch"
readme = "./README.md"
keywords = ["mcp", "search", "metasearch", "cli", "ai-agent"]
categories = ["command-line-utilities", "web-programming"]
include = [
    "src/**/*.rs",
    "benches/**/*.rs",
    "docs/**/*.md",
    "architecture/**/*.md",
    "packaging/systemd/*",
    "packaging/launchd/*",
    "packaging/windows/*",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]
exclude = [
    ".opencode/",
    ".github/",
    "plans/",
    "fuzz/",
]

[lib]
name = "eggsearch"

[[bin]]
name = "eggsearch"
path = "src/main.rs"

[features]
default = []
mock = []
pdf = ["dep:lopdf"]
browser = ["dep:chromiumoxide"]
live-smoke = ["mock"]
egress = ["dep:eggress-outbound", "dep:eggress-uri", "dep:eggress-core"]

[dependencies]
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
futures = "0.3"
http = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rmcp = { version = "3.2.0", features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
url = { version = "2", features = ["serde"] }
eggress-outbound = { version = "=1.0.8", default-features = false, optional = true }
eggress-uri = { version = "=1.0.8", default-features = false, optional = true }
eggress-core = { version = "=1.0.8", default-features = false, optional = true }
eggfetch-core = { version = "0.2.0", default-features = false, features = ["standard-http1", "advanced-routing", "redirects", "tls-rustls", "json", "compression-gzip", "compression-brotli"] }
eggup-core = { git = "https://github.com/eggstack/eggup", rev = "cf5b3d3819c168eb2dbf841daa8332f3eb28c915" }
eggup-acquisition = { git = "https://github.com/eggstack/eggup", rev = "cf5b3d3819c168eb2dbf841daa8332f3eb28c915" }
eggup-eggfetch = { git = "https://github.com/eggstack/eggup", rev = "cf5b3d3819c168eb2dbf841daa8332f3eb28c915" }
eggup-service = { git = "https://github.com/eggstack/eggup", rev = "cf5b3d3819c168eb2dbf841daa8332f3eb28c915" }
semver = "1"
scraper = "0.20"
ego-tree = "0.6.2"
urlencoding = "2"
regex = "1"
toml = "0.8"
dirs = "5"
pulldown-cmark = "0.12"
lopdf = { version = "0.42", optional = true, default-features = false }
chromiumoxide = { version = "0.9", optional = true, default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
libc = "0.2"
lru = "0.18"
tempfile = "3"

[dev-dependencies]
pretty_assertions = "1"
httpmock = "0.7"
criterion = { version = "0.5", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }
sha2 = "0.10"
flate2 = "1"
brotli = "8"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"
self-replace = "1"

[[bench]]
name = "perf"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin"]
