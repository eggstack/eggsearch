[workspace]
resolver = "2"
members = [
    "crates/eggsearch-core",
    "crates/eggsearch-meta",
    "crates/eggsearch-fetch",
    "crates/eggsearch-local",
    "crates/eggsearch-mcp",
    "crates/eggsearch-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/anomalyco/eggsearch"

[workspace.dependencies]
# async + serde
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04", "url2"] }

# core
anyhow = "1"
thiserror = "1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# http + parsing
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream", "json"] }
scraper = "0.20"
html2text = "0.13"
urlencoding = "2"

# local index
tantivy = "0.22"
walkdir = "2"

# cli + config
clap = { version = "4", features = ["derive"] }
clap_complete = { version = "4", features = ["unstable-dynamic"] }
dirs = "5"
toml = "0.8"
config = { version = "0.14", default-features = false, features = ["toml"] }

# MCP
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
rmcp-macros = "1"

# time/duration helpers
humantime = "2"

# error formatting for anyhow
anyhow_ext = "0.1"

# testing
wiremock = "0.6"
insta = { version = "1", features = ["yaml"] }
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
