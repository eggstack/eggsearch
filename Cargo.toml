[package]
name = "eggsearch"
version = "0.3.8"
edition = "2021"
rust-version = "1.88"
authors = ["eggstack"]
license = "MIT"
description = "Lightweight MCP metasearch server for AI agents"
repository = "https://github.com/eggstack/eggsearch"
homepage = "https://docs.rs/eggsearch"
readme = "./README.md"
keywords = ["mcp", "search", "metasearch", "cli", "ai-agent"]
categories = ["command-line-utilities", "web-programming"]
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "benches/**/*.rs",
    "docs/**/*.md",
    "architecture/**/*.md",
    "packaging/systemd/*",
    "packaging/launchd/*",
    "packaging/windows/*",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
]
exclude = [
    ".opencode/",
    ".github/",
    "plans/",
    "fuzz/",
]

[lib]
name = "eggsearch"

[[bin]]
name = "eggsearch"
path = "src/main.rs"

[features]
default = []
mock = []
pdf = ["dep:lopdf"]
browser = ["dep:chromiumoxide"]
live-smoke = ["mock"]

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rmcp = { version = "3.2.0", features = ["server", "client", "transport-io", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "macros"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
url = { version = "2", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "stream", "json"] }
semver = "1"
scraper = "0.20"
ego-tree = "0.6.2"
urlencoding = "2"
regex = "1"
toml = "0.8"
dirs = "5"
pulldown-cmark = "0.12"
lopdf = { version = "0.42", optional = true, default-features = false }
chromiumoxide = { version = "0.9", optional = true, default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
libc = "0.2"
lru = "0.18"
self-replace = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
pretty_assertions = "1"
httpmock = "0.7"
criterion = { version = "0.5", default-features = false }
proptest = { version = "1", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8.1"

[[bench]]
name = "perf"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "aarch64-apple-darwin"]
