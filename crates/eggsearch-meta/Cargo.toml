[package]
name = "eggsearch-meta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/anomalyco/eggsearch"
description = "Metasearch adapter wrapping metadata-search-engine-rs for eggsearch"
keywords = ["search", "metasearch", "scraping", "searxng"]
categories = ["web-programming"]

[features]
default = ["metasearch"]
metasearch = ["dep:metadata-search-engine-rs", "dep:reqwest"]
mock = ["metasearch"]

[dependencies]
eggsearch-core = { path = "../eggsearch-core", version = "0.1.0" }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
tokio = { workspace = true }

# Only required with the `metasearch` feature.
metadata-search-engine-rs = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true }
pretty_assertions = { workspace = true }
