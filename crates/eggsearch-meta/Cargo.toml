[package]
name = "eggsearch-meta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/anomalyco/eggsearch"
description = "Metasearch adapter with vendored search engines for eggsearch"
keywords = ["search", "metasearch", "scraping"]
categories = ["web-programming"]

[features]
default = ["metasearch"]
metasearch = []
mock = ["metasearch"]

[dependencies]
eggsearch-core = { path = "../eggsearch-core", version = "0.1.0" }

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
scraper = "0.20"
urlencoding = "2"

[dev-dependencies]
tokio = { workspace = true }
pretty_assertions = { workspace = true }
