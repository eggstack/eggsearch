[package]
name = "eggsearch-meta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Metasearch adapter wrapping metadata-search-engine-rs for eggsearch"

[features]
default = ["metasearch"]
metasearch = ["dep:metadata-search-engine-rs", "dep:reqwest"]
# Mock upstream engines for integration tests.
mock = ["metasearch"]

[dependencies]
eggsearch-core = { path = "../eggsearch-core" }

async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
tokio = { workspace = true }

# Only required with the `metasearch` feature.
metadata-search-engine-rs = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

[dev-dependencies]
async-trait = { workspace = true }
tokio = { workspace = true }
pretty_assertions = { workspace = true }
