[package]
name = "eggsearch-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MCP server adapter exposing eggsearch metasearch capabilities"

[features]
default = ["metasearch"]
metasearch = ["eggsearch-meta/metasearch"]

[dependencies]
eggsearch-core = { path = "../eggsearch-core" }
eggsearch-meta = { path = "../eggsearch-meta" }

serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
rmcp = { workspace = true }
rmcp-macros = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
