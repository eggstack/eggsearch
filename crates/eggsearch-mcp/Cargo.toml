[package]
name = "eggsearch-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/anomalyco/eggsearch"
description = "MCP server adapter exposing eggsearch metasearch capabilities"
keywords = ["mcp", "search", "metasearch", "ai-agent"]
categories = ["web-programming"]

[features]
default = ["metasearch"]
metasearch = ["eggsearch-meta/metasearch"]
mock = ["eggsearch-meta/mock", "metasearch"]

[dependencies]
eggsearch-core = { path = "../eggsearch-core", version = "0.1.0" }
eggsearch-meta = { path = "../eggsearch-meta", version = "0.1.0" }

serde = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
rmcp = { workspace = true }
rmcp-macros = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = "3"
tokio = { workspace = true }
eggsearch-meta = { path = "../eggsearch-meta", version = "0.1.0", features = ["mock"] }
