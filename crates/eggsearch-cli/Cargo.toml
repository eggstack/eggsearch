[package]
name = "eggsearch"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "eggsearch CLI: metasearch MCP server (doctor, search, providers, mcp stdio)"

[[bin]]
name = "eggsearch"
path = "src/main.rs"

[features]
default = ["metasearch"]
metasearch = ["eggsearch-mcp/metasearch", "eggsearch-meta/metasearch"]

[dependencies]
eggsearch-core = { path = "../eggsearch-core" }
eggsearch-meta = { path = "../eggsearch-meta" }
eggsearch-mcp = { path = "../eggsearch-mcp" }

tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dirs = { workspace = true }
url = { workspace = true }
rmcp = { workspace = true }
futures = { workspace = true }
