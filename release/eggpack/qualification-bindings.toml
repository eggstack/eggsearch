argv = ["--version"]
timeout_ms = 10000
stdout_limit = 8192
stderr_limit = 8192

[targets."x86_64-pc-windows-msvc"]
[targets."x86_64-pc-windows-msvc".smoke]
selector = { kind = "direct" }
argv = ["--version"]
